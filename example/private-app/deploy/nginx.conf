server {
    listen 443 ssl;
    server_name rentals.acme-rentals.example admin.acme-rentals.example;

    ssl_certificate     /etc/letsencrypt/live/acme-rentals.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acme-rentals.example/privkey.pem;

    location / {
        proxy_pass http://203.0.113.47:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
